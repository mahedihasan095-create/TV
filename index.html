<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মেহেদী লাইভ টিভি প্লেয়ার</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #141414;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        /* ডেক্সটপ লেআউট */
        .sidebar {
            width: 340px;
            background-color: #1f1f1f;
            border-right: 2px solid #2d2d2d;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        
        /* হেডার বক্স যা স্ক্রল করলে হাইড হবে */
        .header-sticky {
            background-color: #0f0f0f;
            transition: transform 0.3s ease, margin-top 0.3s ease;
            position: relative;
            z-index: 5;
        }
        .header-sticky.hide {
            transform: translateY(-100%);
            margin-top: -110px;
        }

        .backup-box {
            padding: 12px;
            text-align: center;
        }
        .backup-btn {
            width: 100%;
            padding: 10px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .search-box {
            padding: 0 12px 12px 12px;
        }
        .search-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #222;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }
        .search-input:focus {
            border-color: #00bcd4;
        }

        /* ট্যাব সিস্টেম */
        .tab-box {
            display: flex;
            background-color: #0f0f0f;
            border-bottom: 2px solid #2d2d2d;
            position: sticky;
            top: 0;
            z-index: 6;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #aaa;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .tab-btn.active {
            color: #00bcd4;
            border-bottom: 3px solid #00bcd4;
            background-color: #141414;
        }

        /* চ্যানেল লিস্ট */
        .channel-list-container {
            overflow-y: auto;
            flex-grow: 1;
        }
        .channel-list {
            list-style: none;
        }
        .channel-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }
        .channel-item:hover {
            background-color: #2a2a2a;
        }
        .channel-item.active {
            background-color: #22444d;
            border-left: 4px solid #00bcd4;
        }
        
        .channel-info-box {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* 🖼️ লোগো স্টাইল */
        .channel-logo {
            width: 38px;
            height: 38px;
            border-radius: 6px; /* একটু চারকোনা শেপ লোগোর জন্য মানানসই */
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase;
            flex-shrink: 0;
            object-fit: contain;
            background-color: #2a2a2a;
            border: 1px solid #444;
        }
        .channel-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .action-btns {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .fav-btn {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 1.2rem;
        }
        .fav-btn.is-fav {
            color: #ffca28;
        }
        .edit-btn {
            background: none;
            border: none;
            color: #00bcd4;
            cursor: pointer;
            font-size: 0.9rem;
            opacity: 0.6;
        }

        /* ডান পাশের মেইন প্লেয়ার এরিয়া */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #111;
        }
        .player-container {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16/9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .current-title {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #aaa;
        }
        .current-title span {
            color: #00bcd4;
            font-weight: bold;
        }

        /* 📱 বিশেষ মোবাইল ভিউ সিএসএস */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            
            .main-content {
                width: 100%;
                height: auto;
                padding: 0;
                position: fixed;
                top: 0;
                left: 0;
                z-index: 100;
                background-color: #000;
                box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            }
            .player-container {
                border-radius: 0;
            }
            .current-title {
                display: none;
            }

            .sidebar {
                width: 100%;
                height: calc(100vh - 56.25vw);
                margin-top: 56.25vw;
                border-right: none;
            }
        }
    </style>
</head>
<body>

    <div class="main-content">
        <div class="player-container">
            <video id="videoPlayer" controls autoplay playsinline></video>
        </div>
        <div class="current-title">এখন দেখছেন: <span id="playingChannel">লোড হচ্ছে...</span></div>
    </div>

    <div class="sidebar">
        <div class="header-sticky" id="headerSticky">
            <div class="backup-box">
                <button class="backup-btn" onclick="downloadUpdatedPlaylist()">নতুন playlist.m3u ডাউনলোড করুন</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="চ্যানেল খুঁজুন (Search)..." oninput="onSearchInput()">
            </div>
        </div>
        
        <div class="tab-box">
            <button class="tab-btn active" id="allTabBtn" onclick="switchTab('all')">সব চ্যানেল</button>
            <button class="tab-btn" id="favTabBtn" onclick="switchTab('fav')">★ ফেভারিট</button>
        </div>
        
        <div class="channel-list-container" id="listContainer">
            <ul class="channel-list" id="channelList"></ul>
        </div>
    </div>

<script>
    const video = document.getElementById('videoPlayer');
    const channelListEl = document.getElementById('channelList');
    const playingChannelEl = document.getElementById('playingChannel');
    const searchInput = document.getElementById('searchInput');
    const listContainer = document.getElementById('listContainer');
    const headerSticky = document.getElementById('headerSticky');
    
    let db;
    const dbName = "MehdiM3UAdvancedDB";
    const storeName = "user_settings";

    let m3uLinks = []; 
    let currentTab = 'all'; 
    let searchQuery = ''; 
    let hls = null;
    let activeUrl = "";

    const colors = ['#00bcd4', '#ff4081', '#4caf50', '#ff9800', '#9c27b0', '#e91e63', '#009688', '#3f51b5'];

    // স্ক্রল ট্র্যাকিং (মোবাইলে ডাউনলোড ও সার্চ বক্স অটো-হাইড করার কোড)
    let lastScrollTop = 0;
    listContainer.addEventListener('scroll', () => {
        let scrollTop = listContainer.scrollTop;
        if (scrollTop > lastScrollTop && scrollTop > 50) {
            headerSticky.classList.add('hide');
        } else {
            headerSticky.classList.remove('hide');
        }
        lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
    });

    // ১. ডাটাবেস সেটআপ
    const request = indexedDB.open(dbName, 1);
    request.onupgradeneeded = function(e) {
        db = e.target.result;
        if (!db.objectStoreNames.contains(storeName)) {
            db.createObjectStore(storeName, { keyPath: "url" });
        }
    };
    request.onsuccess = function(e) {
        db = e.target.result;
        fetchPlaylist(); 
    };

    // ২. লিংক থেকে নাম বের করার ব্যাকআপ ফাংশন (যদি কোনোটির এক্সট-ইনফো না থাকে)
    function extractChannelName(url, fallbackCount) {
        try {
            const urlObj = new URL(url);
            const pathParts = urlObj.pathname.split('/').filter(p => p !== "");
            if (pathParts.length > 0) {
                let detectedName = pathParts[pathParts.length - 1];
                if (detectedName.toLowerCase().includes('.m3u8')) {
                    detectedName = pathParts[pathParts.length - 2] || detectedName;
                }
                return detectedName.trim();
            }
        } catch (e) {
            console.error(e);
        }
        return `Channel ${fallbackCount}`;
    }

    // ৩. playlist.m3u ফাইল পড়া এবং লোগো-নাম আলাদা করা
    async function fetchPlaylist() {
        try {
            const response = await fetch('playlist.m3u');
            if (!response.ok) throw new Error("playlist.m3u ফাইলটি পাওয়া যায়নি!");
            const textData = await response.text();
            
            const lines = textData.split('\n');
            let count = 1;
            let currentExtName = "";
            let currentLogo = "";
            let currentGroup = "";

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line === "") continue;

                if (line.startsWith('#EXTINF:')) {
                    // লোগো এক্সট্রাক্ট করা (tvg-logo="...")
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                    currentLogo = logoMatch ? logoMatch[1] : "";

                    // গ্রুপ বা ক্যাটাগরি এক্সট্রাক্ট করা (group-title="...")
                    const groupMatch = line.match(/group-title="([^"]+)"/i);
                    currentGroup = groupMatch ? groupMatch[1] : "Others";

                    // কমা এর পরের আসল চ্যানেলের নাম বের করা
                    const commaIndex = line.lastIndexOf(',');
                    if (commaIndex !== -1) {
                        currentExtName = line.substring(commaIndex + 1).trim();
                    }
                } 
                else if (line.startsWith('http')) {
                    let finalName = currentExtName !== "" ? currentExtName : extractChannelName(line, count);

                    m3uLinks.push({ 
                        defaultName: finalName, 
                        url: line,
                        logo: currentLogo,
                        group: currentGroup
                    });
                    
                    count++;
                    currentExtName = ""; 
                    currentLogo = "";
                    currentGroup = "";
                }
            }

            loadUserSettingsAndRender();
        } catch (error) {
            console.error(error);
            playingChannelEl.textContent = "Error: " + error.message;
        }
    }

    // ৪. ইউজার ডেটা কম্বাইন করা
    function loadUserSettingsAndRender() {
        const transaction = db.transaction([storeName], "readonly");
        const store = transaction.objectStore(storeName);
        const getAllRequest = store.getAll();

        getAllRequest.onsuccess = function() {
            const savedData = getAllRequest.result;
            const savedMap = new Map(savedData.map(item => [item.url, item]));

            window.finalChannels = m3uLinks.map(item => {
                const userSetup = savedMap.get(item.url);
                return {
                    url: item.url,
                    name: userSetup && userSetup.customName ? userSetup.customName : item.defaultName,
                    isFavorite: userSetup ? userSetup.isFavorite : false,
                    logo: item.logo,
                    group: item.group
                };
            });

            renderChannels();

            if (window.finalChannels.length > 0 && activeUrl === "") {
                playStream(window.finalChannels[0].url, window.finalChannels[0].name);
                activeUrl = window.finalChannels[0].url;
                renderChannels();
            }
        };
    }

    // ৫. লিস্ট এবং ইমেজ লোগো রেন্ডার করা
    function renderChannels() {
        channelListEl.innerHTML = '';
        let filteredChannels = window.finalChannels || [];
        
        if (currentTab === 'fav') filteredChannels = filteredChannels.filter(c => c.isFavorite);
        if (searchQuery !== '') {
            filteredChannels = filteredChannels.filter(c => c.name.toLowerCase().includes(searchQuery.toLowerCase()));
        }

        if (filteredChannels.length === 0) {
            channelListEl.innerHTML = `<li style="padding:20px; color:#aaa; text-align:center;">কোনো চ্যানেল পাওয়া যায়নি</li>`;
            return;
        }

        filteredChannels.forEach((channel) => {
            const li = document.createElement('li');
            li.classList.add('channel-item');
            if (channel.url === activeUrl) li.classList.add('active');

            const infoBox = document.createElement('div');
            infoBox.classList.add('channel-info-box');
            infoBox.addEventListener('click', () => {
                activeUrl = channel.url;
                playStream(channel.url, channel.name);
                renderChannels();
                if(window.innerWidth <= 768) window.scrollTo({top: 0, behavior: 'smooth'});
            });

            // 🖼️ ইমেজ লোগো লোড করার স্মার্ট লজিক
            let logoEl;
            if (channel.logo && channel.logo.trim() !== "") {
                logoEl = document.createElement('img');
                logoEl.src = channel.logo;
                logoEl.classList.add('channel-logo');
                // যদি ইমেজ লোড ফেল করে (Fallback)
                logoEl.onerror = function() {
                    replaceWithTextLogo(this, channel.name);
                };
            } else {
                logoEl = document.createElement('div');
                logoEl.classList.add('channel-logo');
                replaceWithTextLogo(logoEl, channel.name);
            }

            const nameSpan = document.createElement('span');
            nameSpan.classList.add('channel-name');
            nameSpan.textContent = channel.name;

            infoBox.appendChild(logoEl);
            infoBox.appendChild(nameSpan);

            const btnGroup = document.createElement('div');
            btnGroup.classList.add('action-btns');

            const editBtn = document.createElement('button');
            editBtn.classList.add('edit-btn');
            editBtn.innerHTML = "✏️";
            editBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                renameChannel(channel.url, channel.name);
            });

            const favBtn = document.createElement('button');
            favBtn.classList.add('fav-btn');
            favBtn.innerHTML = "★";
            if (channel.isFavorite) favBtn.classList.add('is-fav');
            favBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleFavorite(channel.url, !channel.isFavorite, channel.name);
            });

            btnGroup.appendChild(editBtn);
            btnGroup.appendChild(favBtn);
            
            li.appendChild(infoBox);
            li.appendChild(btnGroup);
            channelListEl.appendChild(li);
        });
    }

    // লোগো ইমেজ না থাকলে টেক্সট লোগো বসানোর হেল্পার ফাংশন
    function replaceWithTextLogo(element, name) {
        const textDiv = document.createElement('div');
        textDiv.classList.add('channel-logo');
        textDiv.textContent = name.charAt(0);
        const colorIndex = Math.abs(name.charCodeAt(0)) % colors.length;
        textDiv.style.backgroundColor = colors[colorIndex];
        textDiv.style.color = "#000";
        element.replaceWith(textDiv);
    }

    window.onSearchInput = function() {
        searchQuery = searchInput.value.trim();
        renderChannels();
    };

    window.switchTab = function(tab) {
        currentTab = tab;
        document.getElementById('allTabBtn').classList.toggle('active', tab === 'all');
        document.getElementById('favTabBtn').classList.toggle('active', tab === 'fav');
        renderChannels();
    };

    function renameChannel(url, currentName) {
        const newName = prompt(`"${currentName}" এর জন্য একটি নতুন নাম দিন:`, currentName);
        if (newName === null) return;
        const finalName = newName.trim() === "" ? currentName : newName.trim();

        const transaction = db.transaction([storeName], "readwrite");
        const store = transaction.objectStore(storeName);
        const getReq = store.get(url);
        getReq.onsuccess = function() {
            const data = getReq.result || { url: url, isFavorite: false };
            data.customName = finalName;
            store.put(data).onsuccess = function() {
                if(url === activeUrl) playingChannelEl.textContent = finalName;
                loadUserSettingsAndRender();
            };
        };
    }

    function toggleFavorite(url, favStatus, currentName) {
        const transaction = db.transaction([storeName], "readwrite");
        const store = transaction.objectStore(storeName);
        const getReq = store.get(url);
        getReq.onsuccess = function() {
            const data = getReq.result || { url: url, customName: currentName };
            data.isFavorite = favStatus;
            store.put(data).onsuccess = function() { loadUserSettingsAndRender(); };
        };
    }

    // আপনার দেওয়া অরিজিনাল tvg-logo এবং group-title ঠিক রেখে ডাউনলোড করার ফাংশন
    window.downloadUpdatedPlaylist = function() {
        if (!window.finalChannels || window.finalChannels.length === 0) {
            alert("প্লেলিস্টে কোনো ডেটা নেই!");
            return;
        }
        let fileContent = "#EXTM3U\n#PLAYLIST:Live TV Pro\n";
        window.finalChannels.forEach(channel => {
            fileContent += `#EXTINF:-1 tvg-name="${channel.name}" tvg-logo="${channel.logo || ''}" group-title="${channel.group || 'Others'}",${channel.name}\n${channel.url}\n`;
        });
        const blob = new Blob([fileContent], { type: "text/plain;charset=utf-8" });
        const tempAnchor = document.createElement("a");
        tempAnchor.href = URL.createObjectURL(blob);
        tempAnchor.download = "playlist.m3u";
        document.body.appendChild(tempAnchor);
        tempAnchor.click();
        document.body.removeChild(tempAnchor);
    };

    function playStream(url, name) {
        playingChannelEl.textContent = name;
        if (hls) hls.destroy();

        if (Hls.isSupported()) {
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(e => console.log("Autoplay blocked:", e));
            });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.addEventListener('loadedmetadata', () => { video.play().catch(e => console.log(e)); });
        }
    }
</script>

</body>
</html>
