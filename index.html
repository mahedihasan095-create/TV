<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ফিক্সড - অটো লাইভ টিভি প্লেয়ার</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #141414;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* বাম পাশের সাইডবার */
        .sidebar {
            width: 320px;
            background-color: #1f1f1f;
            border-right: 2px solid #2d2d2d;
            display: flex;
            flex-direction: column;
        }
        /* লিঙ্ক ইনপুট বক্স এরিয়া */
        .input-box {
            padding: 15px;
            background-color: #0f0f0f;
            border-bottom: 2px solid #2d2d2d;
        }
        .input-box h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: #00bcd4;
        }
        .input-box input {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #222;
            color: #fff;
            font-size: 0.9rem;
        }
        .input-box input:focus {
            outline: none;
            border-color: #00bcd4;
        }
        .input-box button {
            width: 100%;
            padding: 8px;
            background-color: #00bcd4;
            border: none;
            border-radius: 4px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .input-box button:hover {
            background-color: #008ba3;
        }
        /* চ্যানেল লিস্ট */
        .channel-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
        }
        .channel-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }
        .channel-item:hover {
            background-color: #2a2a2a;
        }
        .channel-item.active {
            background-color: #00bcd4;
            color: #000;
            font-weight: bold;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #ff5252;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            padding: 2px 5px;
        }
        .delete-btn:hover {
            text-decoration: underline;
        }
        /* ডান পাশের প্লেয়ার এরিয়া */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #111;
        }
        .player-container {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16/9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .current-title {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #aaa;
        }
        .current-title span {
            color: #00bcd4;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="input-box">
            <h3>নতুন চ্যানেল যোগ করুন</h3>
            <input type="text" id="channelName" placeholder="চ্যানেলের নাম (যেমন: Somoy TV)">
            <input type="text" id="channelUrl" placeholder="M3U8 লিংকের ইউআরএল (URL)">
            <button id="addBtn">চ্যানেল যুক্ত করুন</button>
        </div>
        <ul class="channel-list" id="channelList">
            </ul>
    </div>

    <div class="main-content">
        <div class="player-container">
            <video id="videoPlayer" controls autoplay playsinline></video>
        </div>
        <div class="current-title">এখন দেখছেন: <span id="playingChannel">কোনো চ্যানেল সিলেক্ট করা নেই</span></div>
    </div>

<script>
    // সুরক্ষিত উপায়ে লোকাল স্টোরেজ থেকে ডেটা লোড করার ফাংশন
    function loadChannels() {
        try {
            const saved = localStorage.getItem('tv_channels');
            if (saved) {
                return JSON.parse(saved);
            }
        } catch (e) {
            console.error("লোকাল স্টোরেজ অ্যাক্সেস করা যাচ্ছে না:", e);
        }
        // কোনো ডেটা না থাকলে বা এরর হলে ডিফল্ট স্যাম্পল চ্যানেল
        return [
            { name: "নমুনা চ্যানেল (Sample)", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" }
        ];
    }

    let channels = loadChannels();

    const video = document.getElementById('videoPlayer');
    const channelListEl = document.getElementById('channelList');
    const playingChannelEl = document.getElementById('playingChannel');
    
    const nameInput = document.getElementById('channelName');
    const urlInput = document.getElementById('channelUrl');
    const addBtn = document.getElementById('addBtn');
    
    let hls = null;

    // লোকাল স্টোরেজে ডেটা সেভ করার ফাংশন
    function saveChannelsToStorage() {
        try {
            localStorage.setItem('tv_channels', JSON.stringify(channels));
        } catch (e) {
            alert("আপনার ব্রাউজার ডেটা সেভ করা ব্লক করছে। দয়া করে ইনকগনিটো মোড বন্ধ করুন বা ব্রাউজার সেটিংস চেক করুন।");
        }
    }

    // চ্যানেল লিস্ট স্ক্রিনে দেখানোর ফাংশন
    function renderChannels() {
        channelListEl.innerHTML = ''; 
        
        channels.forEach((channel, index) => {
            const li = document.createElement('li');
            li.classList.add('channel-item');
            
            const nameSpan = document.createElement('span');
            nameSpan.textContent = channel.name;
            nameSpan.style.flexGrow = "1";
            nameSpan.style.cursor = "pointer";
            
            nameSpan.addEventListener('click', () => {
                document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                li.classList.add('active');
                playStream(channel.url, channel.name);
            });
            
            const delBtn = document.createElement('button');
            delBtn.textContent = "মুছুন";
            delBtn.classList.add('delete-btn');
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation(); 
                deleteChannel(index);
            });

            li.appendChild(nameSpan);
            li.appendChild(delBtn);
            channelListEl.appendChild(li);
        });

        // ডেটা সেভ করা
        saveChannelsToStorage();
    }

    // নতুন চ্যানেল অ্যাড করার ফাংশন
    addBtn.addEventListener('click', () => {
        const name = nameInput.value.trim();
        const url = urlInput.value.trim();

        if (name === '' || url === '') {
            alert('দয়া করে নাম এবং লিঙ্ক দুটিই সঠিকভাবে দিন!');
            return;
        }

        // নতুন চ্যানেল লিস্টে যোগ করা
        channels.push({ name: name, url: url });
        
        // ইনপুট বক্স খালি করা
        nameInput.value = '';
        urlInput.value = '';

        renderChannels(); 
        
        // নতুন চ্যানেলটি প্লে করা
        const lastIndex = channels.length - 1;
        playStream(url, name);
        
        setTimeout(() => {
            const items = document.querySelectorAll('.channel-item');
            if(items.length > 0) items[lastIndex].classList.add('active');
        }, 50);
    });

    // চ্যানেল ডিলিট করার ফাংশন
    function deleteChannel(index) {
        if(confirm("আপনি কি নিশ্চিতভাবে এই চ্যানেলটি মুছে ফেলতে চান?")) {
            channels.splice(index, 1);
            renderChannels();
            // প্রথম চ্যানেলটি আবার প্লে করা যদি কোনো চ্যানেল বাকি থাকে
            if(channels.length > 0) {
                playStream(channels[0].url, channels[0].name);
                const firstItem = document.querySelector('.channel-item');
                if(firstItem) firstItem.classList.add('active');
            } else {
                video.src = '';
                playingChannelEl.textContent = 'কোনো চ্যানেল সিলেক্ট করা নেই';
            }
        }
    }

    // ভিডিও প্লে করার মেইন ফাংশন
    function playStream(url, name) {
        playingChannelEl.textContent = name;

        if (hls) {
            hls.destroy();
        }

        if (Hls.isSupported()) {
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(e => console.log("Autoplay blocked:", e));
            });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.addEventListener('loadedmetadata', () => {
                video.play().catch(e => console.log("Autoplay blocked:", e));
            });
        } else {
            alert("আপনার ব্রাউজারে এই ভিডিওটি সাপোর্ট করছে না।");
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        renderChannels();
        if(channels.length > 0) {
            playStream(channels[0].url, channels[0].name);
            setTimeout(() => {
                const firstItem = document.querySelector('.channel-item');
                if(firstItem) firstItem.classList.add('active');
            }, 50);
        }
    });
</script>

</body>
</html>
