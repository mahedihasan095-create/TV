<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্মার্ট অটো-ডিটেক্ট লাইভ টিভি প্লেয়ার</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #141414;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* বাম পাশের সাইডবার */
        .sidebar {
            width: 340px;
            background-color: #1f1f1f;
            border-right: 2px solid #2d2d2d;
            display: flex;
            flex-direction: column;
        }
        /* ব্যাকআপ বাটন এরিয়া */
        .backup-box {
            padding: 12px;
            background-color: #0f0f0f;
            border-bottom: 2px solid #2d2d2d;
            text-align: center;
        }
        .backup-btn {
            width: 100%;
            padding: 10px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .backup-btn:hover {
            background-color: #388e3c;
        }
        /* ট্যাব সিস্টেম */
        .tab-box {
            display: flex;
            background-color: #0f0f0f;
            border-bottom: 2px solid #2d2d2d;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #aaa;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            font-size: 0.9rem;
        }
        .tab-btn.active {
            color: #00bcd4;
            border-bottom: 3px solid #00bcd4;
            background-color: #141414;
        }
        /* চ্যানেল লিস্ট */
        .channel-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
        }
        .channel-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .channel-item:hover {
            background-color: #2a2a2a;
        }
        .channel-item.active {
            background-color: #22444d;
            border-left: 4px solid #00bcd4;
        }
        
        /* লোগো এবং নাম একসাথে রাখার জন্য */
        .channel-info-box {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 10px;
        }
        /* অটো জেনারেটেড স্মার্ট লোগো */
        .channel-logo {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background-color: #00bcd4;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .channel-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* অ্যাকশন বাটন */
        .action-btns {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .fav-btn {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 1.2rem;
        }
        .fav-btn.is-fav {
            color: #ffca28;
        }
        .edit-btn {
            background: none;
            border: none;
            color: #00bcd4;
            cursor: pointer;
            font-size: 0.9rem;
            opacity: 0.6;
        }
        .edit-btn:hover {
            opacity: 1;
        }
        /* ডান পাশের প্লেয়ার এরিয়া */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #111;
        }
        .player-container {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16/9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .current-title {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #aaa;
        }
        .current-title span {
            color: #00bcd4;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="backup-box">
            <button class="backup-btn" onclick="downloadUpdatedPlaylist()">নতুন playlist.txt ডাউনলোড করুন</button>
        </div>
        <div class="tab-box">
            <button class="tab-btn active" id="allTabBtn" onclick="switchTab('all')">সব চ্যানেল</button>
            <button class="tab-btn" id="favTabBtn" onclick="switchTab('fav')">★ ফেভারিট</button>
        </div>
        <ul class="channel-list" id="channelList"></ul>
    </div>

    <div class="main-content">
        <div class="player-container">
            <video id="videoPlayer" controls autoplay playsinline></video>
        </div>
        <div class="current-title">এখন দেখছেন: <span id="playingChannel">로드 중...</span></div>
    </div>

<script>
    const video = document.getElementById('videoPlayer');
    const channelListEl = document.getElementById('channelList');
    const playingChannelEl = document.getElementById('playingChannel');
    
    let db;
    const dbName = "SmartTVDB";
    const storeName = "user_settings";

    let txtLinks = []; 
    let currentTab = 'all'; 
    let hls = null;
    let activeUrl = "";

    // লোগোর ব্যাকগ্রাউন্ড কালার সুন্দর করার জন্য কিছু র্যান্ডম কালার প্যালেট
    const colors = ['#00bcd4', '#ff4081', '#4caf50', '#ff9800', '#9c27b0', '#e91e63', '#009688', '#3f51b5'];

    // ১. ডাটাবেস সেটআপ
    const request = indexedDB.open(dbName, 1);
    request.onupgradeneeded = function(e) {
        db = e.target.result;
        if (!db.objectStoreNames.contains(storeName)) {
            db.createObjectStore(storeName, { keyPath: "url" });
        }
    };
    request.onsuccess = function(e) {
        db = e.target.result;
        fetchPlaylist(); 
    };

    // ২. ইউআরএল থেকে অটোমেটিক নাম বের করার ম্যাজিক ফাংশন
    function extractChannelName(url, fallbackCount) {
        try {
            const urlObj = new URL(url);
            const pathParts = urlObj.pathname.split('/').filter(p => p !== "");
            
            if (pathParts.length > 0) {
                // সাধারণত index.m3u8 এর ঠিক আগের অংশটিই চ্যানেলের নাম হয়
                let detectedName = pathParts[pathParts.length - 1];
                if (detectedName.toLowerCase().includes('index') || detectedName.toLowerCase().includes('playlist')) {
                    detectedName = pathParts[pathParts.length - 2] || detectedName;
                }
                // নামের ভেতরের ড্যাশ বা ডট পরিষ্কার করা এবং প্রথম অক্ষর বড় হাতের করা
                detectedName = detectedName.replace(/[-_.]/g, ' ');
                return detectedName.charAt(0).toUpperCase() + detectedName.slice(1);
            }
        } catch (e) {
            console.error("ইউআরএল পার্স করা যায়নি");
        }
        return `Channel ${fallbackCount}`;
    }

    // ৩. playlist.txt ফাইল পড়া
    async function fetchPlaylist() {
        try {
            const response = await fetch('playlist.txt');
            if (!response.ok) throw new Error("playlist.txt ফাইলটি পাওয়া যায়নি!");
            const textData = await response.text();
            
            const lines = textData.split('\n');
            let count = 1;
            lines.forEach(line => {
                const trimmedLine = line.trim();
                if (trimmedLine !== "") {
                    if (trimmedLine.includes(',')) {
                        const parts = trimmedLine.split(',');
                        txtLinks.push({ defaultName: parts[0].trim(), url: parts[1].trim() });
                    } else if (trimmedLine.startsWith('http')) {
                        // যদি শুধু লিঙ্ক থাকে, তবে অটোমেটিক নাম ডিটেক্ট করবে
                        const autoDetectedName = extractChannelName(trimmedLine, count);
                        txtLinks.push({ defaultName: autoDetectedName, url: trimmedLine });
                        count++;
                    }
                }
            });

            loadUserSettingsAndRender();
        } catch (error) {
            playingChannelEl.textContent = "Error: " + error.message;
        }
    }

    // ৪. ডেটাবেস এবং টেক্সট ফাইল কম্বাইন করা
    function loadUserSettingsAndRender() {
        const transaction = db.transaction([storeName], "readonly");
        const store = transaction.objectStore(storeName);
        const getAllRequest = store.getAll();

        getAllRequest.onsuccess = function() {
            const savedData = getAllRequest.result;
            const savedMap = new Map(savedData.map(item => [item.url, item]));

            window.finalChannels = txtLinks.map(item => {
                const userSetup = savedMap.get(item.url);
                return {
                    url: item.url,
                    name: userSetup && userSetup.customName ? userSetup.customName : item.defaultName,
                    isFavorite: userSetup ? userSetup.isFavorite : false
                };
            });

            renderChannels();

            if (window.finalChannels.length > 0 && activeUrl === "") {
                playStream(window.finalChannels[0].url, window.finalChannels[0].name);
                activeUrl = window.finalChannels[0].url;
                renderChannels();
            }
        };
    }

    // ৫. লিস্ট এবং অটো লোগো দেখানো
    function renderChannels() {
        channelListEl.innerHTML = '';
        let filteredChannels = window.finalChannels || [];
        if (currentTab === 'fav') filteredChannels = filteredChannels.filter(c => c.isFavorite);

        if (filteredChannels.length === 0) {
            channelListEl.innerHTML = `<li style="padding:20px; color:#aaa; text-align:center;">কোনো চ্যানেল নেই</li>`;
            return;
        }

        filteredChannels.forEach((channel, index) => {
            const li = document.createElement('li');
            li.classList.add('channel-item');
            if (channel.url === activeUrl) li.classList.add('active');

            // লোগো + নাম বক্স
            const infoBox = document.createElement('div');
            infoBox.classList.add('channel-info-box');
            infoBox.addEventListener('click', () => {
                activeUrl = channel.url;
                playStream(channel.url, channel.name);
                renderChannels();
            });

            // অটোমেটিক লোগো আইকন তৈরি
            const logoEl = document.createElement('div');
            logoEl.classList.add('channel-logo');
            logoEl.textContent = channel.name.charAt(0); // নামের প্রথম অক্ষর
            // নামের ওপর ভিত্তি করে নির্দিষ্ট কালার দেওয়া যাতে প্রতিবার একই কালার থাকে
            const colorIndex = Math.abs(channel.name.charCodeAt(0)) % colors.length;
            logoEl.style.backgroundColor = colors[colorIndex];

            // নাম টেক্সট
            const nameSpan = document.createElement('span');
            nameSpan.classList.add('channel-name');
            nameSpan.textContent = channel.name;

            infoBox.appendChild(logoEl);
            infoBox.appendChild(nameSpan);

            // অ্যাকশন বাটন গ্রুপ
            const btnGroup = document.createElement('div');
            btnGroup.classList.add('action-btns');

            const editBtn = document.createElement('button');
            editBtn.classList.add('edit-btn');
            editBtn.innerHTML = "✏️";
            editBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                renameChannel(channel.url, channel.name);
            });

            const favBtn = document.createElement('button');
            favBtn.classList.add('fav-btn');
            favBtn.innerHTML = "★";
            if (channel.isFavorite) favBtn.classList.add('is-fav');
            favBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleFavorite(channel.url, !channel.isFavorite, channel.name);
            });

            btnGroup.appendChild(editBtn);
            btnGroup.appendChild(favBtn);
            
            li.appendChild(infoBox);
            li.appendChild(btnGroup);
            channelListEl.appendChild(li);
        });
    }

    // ৬. ট্যাব পরিবর্তন
    window.switchTab = function(tab) {
        currentTab = tab;
        document.getElementById('allTabBtn').classList.toggle('active', tab === 'all');
        document.getElementById('favTabBtn').classList.toggle('active', tab === 'fav');
        renderChannels();
    };

    // ৭. নাম পরিবর্তন করা
    function renameChannel(url, currentName) {
        const newName = prompt(`"${currentName}" এর জন্য একটি নতুন নাম দিন:`, currentName);
        if (newName === null) return;
        const finalName = newName.trim() === "" ? currentName : newName.trim();

        const transaction = db.transaction([storeName], "readwrite");
        const store = transaction.objectStore(storeName);
        
        const getReq = store.get(url);
        getReq.onsuccess = function() {
            const data = getReq.result || { url: url, isFavorite: false };
            data.customName = finalName;
            store.put(data).onsuccess = function() {
                if(url === activeUrl) playingChannelEl.textContent = finalName;
                loadUserSettingsAndRender();
            };
        };
    }

    // ৮. ফেভারিট সেট করা
    function toggleFavorite(url, favStatus, currentName) {
        const transaction = db.transaction([storeName], "readwrite");
        const store = transaction.objectStore(storeName);
        const getReq = store.get(url);
        getReq.onsuccess = function() {
            const data = getReq.result || { url: url, customName: currentName };
            data.isFavorite = favStatus;
            store.put(data).onsuccess = function() { loadUserSettingsAndRender(); };
        };
    }

    // ৯. নতুন নামসহ প্লেলিস্ট ডাউনলোড করা
    window.downloadUpdatedPlaylist = function() {
        if (!window.finalChannels || window.finalChannels.length === 0) {
            alert("প্লেলিস্টে কোনো ডেটা নেই!");
            return;
        }
        let fileContent = "";
        window.finalChannels.forEach(channel => {
            fileContent += `${channel.name},${channel.url}\n`;
        });
        const blob = new Blob([fileContent], { type: "text/plain;charset=utf-8" });
        const tempAnchor = document.createElement("a");
        tempAnchor.href = URL.createObjectURL(blob);
        tempAnchor.download = "playlist.txt";
        document.body.appendChild(tempAnchor);
        tempAnchor.click();
        document.body.removeChild(tempAnchor);
    };

    // ১০. ভিডিও প্লে
    function playStream(url, name) {
        playingChannelEl.textContent = name;
        if (hls) hls.destroy();

        if (Hls.isSupported()) {
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(e => console.log("Autoplay blocked:", e));
            });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.addEventListener('loadedmetadata', () => { video.play().catch(e => console.log(e)); });
        }
    }
</script>

</body>
</html>
